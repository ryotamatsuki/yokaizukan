name: Apply Ishizuchi Hokibo migration

on:
  push:
    branches:
      - feature/ishizuchi-hokibo-tengu
    paths:
      - scripts/apply_ishizuchi_hokibo_patch.mjs
      - .github/workflows/apply-ishizuchi-hokibo-patch.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/ishizuchi-hokibo-tengu

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply data migration
        run: node scripts/apply_ishizuchi_hokibo_patch.mjs

      - name: Refine literary wording
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const paths = ['public/data/articles.json', 'scripts/fixtures/ehime_11_articles.json'];
          for (const path of paths) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const article = data.articles.find((item) => item.id === 'ishizuchi_tengu_cluster');
            const section = article?.sections.find((item) => item.heading === '山麓に残る烏天狗の話');
            if (!section) throw new Error(`${path}: Karasu-tengu section not found`);
            let changed = false;
            section.body = section.body.map((paragraph) => {
              if (!paragraph.includes('分けて読みます')) return paragraph;
              changed = true;
              return paragraph.replace('資料の系統を分けて読みます', '別々の資料に伝わっています');
            });
            if (!changed) throw new Error(`${path}: literary wording token not found`);
            fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          }
          NODE

      - name: Refresh cross-phase Ehime protection hashes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const validatorPath = 'scripts/validate_yokai_research_deepening_phase4.mjs';
          const blobSha = (path) => {
            const content = fs.readFileSync(path);
            const header = Buffer.from(`blob ${content.length}\0`);
            return crypto.createHash('sha1').update(header).update(content).digest('hex');
          };
          let text = fs.readFileSync(validatorPath, 'utf8');
          for (const path of ['public/data/ehime_research_v2.json', 'public/data/legends.json']) {
            const sha = blobSha(path);
            const escaped = path.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`('${escaped}':\\s*')[0-9a-f]{40}(')`);
            if (!pattern.test(text)) throw new Error(`${validatorPath}: protected hash entry missing for ${path}`);
            text = text.replace(pattern, `$1${sha}$2`);
          }
          fs.writeFileSync(validatorPath, text);
          NODE

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/validate_ehime_11_traditions.mjs
          node --check scripts/validate_ehime_literary_editing_v1.mjs
          node --check scripts/validate_yokai_research_deepening_phase4.mjs

      - name: Install test dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Run data validation
        run: npm run validate:data

      - name: Remove one-shot migration files
        run: |
          rm scripts/apply_ishizuchi_hokibo_patch.mjs
          rm .github/workflows/apply-ishizuchi-hokibo-patch.yml

      - name: Commit migrated source-of-truth data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/legends.json public/data/articles.json public/data/sources.json public/data/evidence_check_table.json public/data/ehime_research_v2.json scripts/fixtures/ehime_11_articles.json scripts/validate_ehime_11_traditions.mjs scripts/validate_ehime_literary_editing_v1.mjs scripts/validate_yokai_research_deepening_phase4.mjs scripts/apply_ishizuchi_hokibo_patch.mjs .github/workflows/apply-ishizuchi-hokibo-patch.yml
          git commit -m "feat: expand Ishizuchi tengu cluster with Hokibo"
          git push origin HEAD:feature/ishizuchi-hokibo-tengu
