name: Validate catalog data

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/research.js
          node --check js/ehime.js
          node --check js/ehime-research-v2.js
          node --check scripts/run_data_integrity_compact.mjs
          node --check scripts/validate_ehime_research_v2.mjs
          node --check scripts/validate_ehime_ui_contract.mjs
          node --check scripts/validate_yokai_research_pilot.mjs
          node --check scripts/validate_yokai_research_expansions.mjs
          node --check playwright.config.mjs
          node --check tests/e2e/ehime-research.spec.mjs

      - name: Install test dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Validate catalog data
        run: npm run validate:data

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run minimal Ehime browser regression
        run: npm run test:e2e:ehime
