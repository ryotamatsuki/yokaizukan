name: Validate catalog data

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/literary.js
          node --check js/research.js
          node --check js/ehime.js
          node --check js/ehime-opening.js
          node --check js/ehime-research-v2.js
          node --check js/ehime-map-debug.js
          node --check scripts/run_data_integrity_compact.mjs
          node --check scripts/validate_ehime_research_v2.mjs
          node --check scripts/validate_ehime_ui_contract.mjs
          node --check scripts/validate_ehime_literary_editing_v1.mjs
          node --check scripts/validate_ehime_geographic_base.mjs
          node --check scripts/validate_yokai_research_pilot.mjs
          node --check scripts/validate_yokai_research_expansions.mjs
          node --check scripts/validate_yokai_literary_editing_v1.mjs
          node --check scripts/validate_yokai_literary_phase2_audit.mjs
          node --check scripts/validate_yokai_literary_phase2.mjs
          node --check scripts/validate_yokai_literary_phase3.mjs
          node --check scripts/validate_yokai_research_deepening_phase4.mjs
          node --check playwright.config.mjs
          node --check tests/e2e/ehime-opening.spec.mjs
          node --check tests/e2e/ehime-research.spec.mjs
          node --check tests/e2e/ehime-map.spec.mjs
          node --check tests/e2e/yokai-literary.spec.mjs
          node --check tests/e2e/yokai-literary-phase3.spec.mjs
          node --check tests/e2e/yokai-research-phase4.spec.mjs

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/vendor_ehime_n03.py
          python -m py_compile scripts/vendor_ehime_office_anchors.py
          python -m py_compile scripts/validate_ehime_geographic_base.py

      - name: Check whitespace errors
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD

      - name: Install geographic validation dependency
        run: python -m pip install --disable-pip-version-check shapely==2.1.1

      - name: Run Ehime geographic 20/20 hard gate
        run: python scripts/validate_ehime_geographic_base.py

      - name: Install test dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Validate catalog data
        run: npm run validate:data

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regression
        run: npm run test:e2e
