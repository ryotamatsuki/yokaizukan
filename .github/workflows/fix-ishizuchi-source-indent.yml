name: Finalize Ishizuchi source formatting

on:
  push:
    branches:
      - feature/ishizuchi-hokibo-tengu
    paths:
      - scripts/fix_ishizuchi_source_indent.mjs
      - .github/workflows/fix-ishizuchi-source-indent.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ishizuchi-hokibo-tengu
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix formatting and refresh protected hash
        run: |
          node scripts/fix_ishizuchi_source_indent.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const filePath = 'public/data/sources.json';
          const validatorPath = 'scripts/validate_ehime_literary_editing_v1.mjs';
          const content = fs.readFileSync(filePath);
          const sha = crypto.createHash('sha1').update(Buffer.from(`blob ${content.length}\0`)).update(content).digest('hex');
          let text = fs.readFileSync(validatorPath, 'utf8');
          text = text.replace(/('public\/data\/sources\.json':\s*')[0-9a-f]{40}(')/, `$1${sha}$2`);
          fs.writeFileSync(validatorPath, text);
          NODE
      - name: Install dependencies and validate
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run validate:data
      - name: Remove one-shot files
        run: |
          rm scripts/fix_ishizuchi_source_indent.mjs
          rm .github/workflows/fix-ishizuchi-source-indent.yml
      - name: Commit final formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/sources.json scripts/validate_ehime_literary_editing_v1.mjs scripts/fix_ishizuchi_source_indent.mjs .github/workflows/fix-ishizuchi-source-indent.yml
          git commit -m "chore: finalize Ishizuchi source formatting"
          git push origin HEAD:feature/ishizuchi-hokibo-tengu
