name: Shared-origin URL safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/security.test.cjs
