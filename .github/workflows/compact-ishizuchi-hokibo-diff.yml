name: Compact Ishizuchi Hokibo diff

on:
  push:
    branches:
      - feature/ishizuchi-hokibo-tengu
    paths:
      - scripts/compact_ishizuchi_hokibo_diff.mjs
      - .github/workflows/compact-ishizuchi-hokibo-diff.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/ishizuchi-hokibo-tengu
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compact diff
        run: node scripts/compact_ishizuchi_hokibo_diff.mjs

      - name: Validate syntax
        run: |
          node --check scripts/validate_ehime_11_traditions.mjs
          node --check scripts/validate_ehime_literary_editing_v1.mjs
          node --check scripts/validate_yokai_research_deepening_phase4.mjs

      - name: Install test dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Validate all catalog data
        run: npm run validate:data

      - name: Remove one-shot compactor
        run: |
          rm scripts/compact_ishizuchi_hokibo_diff.mjs
          rm .github/workflows/compact-ishizuchi-hokibo-diff.yml

      - name: Commit compact review diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/legends.json public/data/articles.json public/data/sources.json public/data/evidence_check_table.json public/data/ehime_research_v2.json scripts/fixtures/ehime_11_articles.json scripts/validate_ehime_11_traditions.mjs scripts/validate_ehime_literary_editing_v1.mjs scripts/validate_yokai_research_deepening_phase4.mjs scripts/compact_ishizuchi_hokibo_diff.mjs .github/workflows/compact-ishizuchi-hokibo-diff.yml
          git commit -m "chore: compact Ishizuchi Hokibo review diff"
          git push origin HEAD:feature/ishizuchi-hokibo-tengu
